# 演示优化档案 v2 —— 黄圣鑫
# 设计原则：**检测贴近他的默认（略松），飞行包络尽量放开**
#
# 高度：z_low=0.7 / z_high=12 → 安全硬顶 13 m（三楼约 9 m，留 4 m 余量）
#       手动升降上限 TELEOP_DZ_MAX = MAX_HEIGHT - 0.5 = 12.5 m
# 水平：GATE_XY_MAX = 100 → 硬围栏 102 m
# 超硬顶的后果：持续 0.25 s 就**强制缓降**（不是停桨，飞机不会掉）
#
# 用法：~/flight_sites/演示优化.conf
#       python3 stage14_mission.py --site 演示优化 --dry-run

site_name = 演示优化
task      = 穿环
scene     = 低空          # 允许水平漂移 1.5 m（四档里最松）
takeoff_h = 1.5           # 起飞高度（相对起飞点）
z_low     = 0.7           # 瞄点最低高度（≥0.7：低于这个桨风会吹到手/板，测量变毛）
z_high    = 12.0          # 瞄点最高高度 → 安全硬顶 13 m（三楼够）
xy_radius = 100           # m 水平范围（软限）；硬围栏 = 100 + 2 = 102 m

mode      = 停靠          # 演练用停靠；实飞改 冲刺
target    = 红点
dock_dist = 3.0
dock_hold = 20
refine_dy = 0.3

# ── 水平包络：100 m（硬围栏 102 m）──────────────────────

# ── 速度：抵近 0.8 → 阶段包络 1.6 m/s；手动跟到 1.6 ──────
set.GATE_REPO_V        = 0.8
set.TELEOP_XY_SPEED    = 1.6
set.TELEOP_Z_SPEED     = 0.6     # 升降（默认 0.3，爬三楼要 30 秒太慢）

# ── 超时 / 容错 ────────────────────────────────────────
set.GATE_MANUAL_TIMEOUT = 600.0  # 手动段 10 分钟（爬楼演示可能久）
set.GATE_APPR_FAIL_S    = 15.0   # 抵近丢目标 15 s 才放弃（原 5）
set.GATE_APPR_TIMEOUT   = 180.0  # 抵近总时长（原 60）
set.DOT_SD_MAX_CM       = 60.0   # 单帧横向 σ 上限（原 40；远距 σ 本来就大）
# ── 50 m 远距启用（2026-11-21）──────────────
set.DOT_D_MAX           = 60.0   # 红点发现级距离 14 -> 60 m
set.DOT_SD_ALONG_MAX_CM = 600.0  # 深度 σ 3 -> 6 m (50 m 处立体视差只剩 ~2 px)
set.DOT_SEL_SCORE       = 0.30   # 自动选点门槛 0.5 -> 0.3 (50 m 处分数偏低)
